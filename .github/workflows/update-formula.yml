name: Update Formula

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (e.g., 0.8.8)'
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          # Strip "v" prefix if present
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Updating to version: $VERSION"

      - name: Download checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release download "v${VERSION}" \
            --repo rustledger/rustledger \
            --pattern "*.sha256" \
            --dir checksums
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract checksums (use grep -h to suppress filename prefix)
          SHA_MACOS_ARM=$(grep -h "aarch64-apple-darwin.tar.gz" checksums/*.sha256 | cut -d' ' -f1)
          SHA_MACOS_INTEL=$(grep -h "x86_64-apple-darwin.tar.gz" checksums/*.sha256 | cut -d' ' -f1)
          SHA_LINUX_ARM=$(grep -h "aarch64-unknown-linux-gnu.tar.gz" checksums/*.sha256 | cut -d' ' -f1)
          SHA_LINUX_INTEL=$(grep -h "x86_64-unknown-linux-gnu.tar.gz" checksums/*.sha256 | cut -d' ' -f1)

          # Debug: show extracted checksums
          echo "VERSION: $VERSION"
          echo "SHA_MACOS_ARM: $SHA_MACOS_ARM"
          echo "SHA_MACOS_INTEL: $SHA_MACOS_INTEL"
          echo "SHA_LINUX_ARM: $SHA_LINUX_ARM"
          echo "SHA_LINUX_INTEL: $SHA_LINUX_INTEL"

          # Generate formula from template
          cp Formula/rustledger.rb.template Formula/rustledger.rb
          sed -i "s|{{VERSION}}|${VERSION}|g" Formula/rustledger.rb
          sed -i "s|{{SHA_MACOS_ARM}}|${SHA_MACOS_ARM}|g" Formula/rustledger.rb
          sed -i "s|{{SHA_MACOS_INTEL}}|${SHA_MACOS_INTEL}|g" Formula/rustledger.rb
          sed -i "s|{{SHA_LINUX_ARM}}|${SHA_LINUX_ARM}|g" Formula/rustledger.rb
          sed -i "s|{{SHA_LINUX_INTEL}}|${SHA_LINUX_INTEL}|g" Formula/rustledger.rb

          echo "Generated formula:"
          cat Formula/rustledger.rb

      - name: Commit and push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rustledger.rb
          git commit -m "Update rustledger to ${VERSION}" || exit 0
          git push
